name: Build Datti Trznica Release APK

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Datti project
        shell: bash
        run: |
          cat > /tmp/datti.zip.b64 <<'B64'
          
          B64
          base64 -d /tmp/datti.zip.b64 > /tmp/datti.zip
          unzip -q /tmp/datti.zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: datti-trznica-native
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: datti-trznica-native
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone release APK
        working-directory: datti-trznica-native
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript
        working-directory: datti-trznica-native
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'index\.android\.bundle|index\.bundle|assets/.+bundle' || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Datti-Trznica-Android-Release-APK
          path: datti-trznica-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
